name: dafl

services:
  # 1. PostgreSQL 16 Alpine (Lightweight for demo, ~80MB vs 2GB+ SQL Server)
  postgres:
    image: postgres:16-alpine
    container_name: dafl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dafl_db}
      POSTGRES_USER: ${POSTGRES_USER:-dafl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dafl_password123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dafl-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dafl} -d $${POSTGRES_DB:-dafl_db} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  # 3. Apache Kafka 3.7+ in KRaft Mode (No Zookeeper required)
  kafka:
    image: apache/kafka:3.7.0
    container_name: dafl-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - dafl-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 4. Backend: .NET 8 Web API (Vertical Slice Architecture)
  backend:
    build:
      context: ./src/Backend
      dockerfile: Dockerfile
    container_name: dafl-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-dafl_db};Username=${POSTGRES_USER:-dafl};Password=${POSTGRES_PASSWORD:-dafl_password123};
      - CacheSettings__Enabled=false
      - KafkaSettings__BootstrapServers=kafka:9092
      - Frontend__BaseUrl=http://localhost:${FRONTEND_PORT:-3000}
      # JWT (CN-02): secret ký token hạn 1 giờ. Đặt JWT_SECRET trong file .env (chuỗi ngẫu nhiên dài) — xem .env.example.
      - Jwt__Secret=${JWT_SECRET:-}
      # SMTP (đợt 13, mục 1): gửi email đặt lại mật khẩu thật. Điền SMTP_* vào .env — xem .env.example.
      # Để trống → IEmailSender.IsConfigured = false, quên mật khẩu chỉ ghi mã ra log ở Development.
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__From=${SMTP_FROM:-}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
      # Social login (Google/Facebook): tạo OAuth client / Meta app rồi điền vào .env — xem .env.example.
      # Để trống → nút provider tương ứng tự ẩn (GET /api/auth/social/config trả enabled = false).
      - Social__GoogleClientId=${GOOGLE_CLIENT_ID:-}
      - Social__FacebookAppId=${FACEBOOK_APP_ID:-}
      - Social__FacebookAppSecret=${FACEBOOK_APP_SECRET:-}
      - PayOS__ClientId=${PAYOS_CLIENT_ID:-demo_client_id}
      - PayOS__ApiKey=${PAYOS_API_KEY:-demo_api_key}
      - PayOS__ChecksumKey=${PAYOS_CHECKSUM_KEY:-demo_checksum_key}
    volumes:
      # Ảnh admin upload (POST /api/admin/upload) lưu ở /app/uploads trong container;
      # volume giữ ảnh lại khi rebuild/recreate container backend.
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dafl-network

  # 5. Frontend: ReactJS + Vite (Served via Nginx Alpine)
  # App shop riêng ở src/Frontend; build context là ./src (workspace npm)
  # để import được code dùng chung src/Shared. Không còn cờ VITE_ADMIN_ONLY.
  frontend:
    build:
      context: ./src
      dockerfile: Frontend/Dockerfile
    container_name: dafl-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - dafl-network

  # 6. Admin riêng: app độc lập ở src/Admin (route / -> /admin), chạy ở
  # localhost riêng 3001. API vẫn dùng chung backend qua nginx proxy /api
  # như bản shop (không cần sửa gì thêm). Bật/tắt cổng bằng ADMIN_PORT
  # trong .env (mặc định 3001). Build context ./src như service frontend.
  admin:
    build:
      context: ./src
      dockerfile: Admin/Dockerfile
    container_name: dafl-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3001}:80"
    depends_on:
      - backend
    networks:
      - dafl-network

  # 7. Gateway: YARP reverse proxy .NET 8 (đợt 14) — điểm vào chung cho
  # shop + API ở cổng 8080. Chỉ proxy, không có logic nghiệp vụ.
  # Admin KHÔNG qua gateway (quyết định có chủ ý): admin giữ cổng riêng
  # trực tiếp :3001 làm entry riêng vì lý do bảo mật; test Selenium admin
  # chạy thẳng :3001, không đổi. Xem src/Gateway/README.md.
  gateway:
    build:
      context: ./src/Gateway
      dockerfile: Dockerfile
    container_name: dafl-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - backend
      - frontend
      - admin
    networks:
      - dafl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  dafl-network:
    driver: bridge

volumes:
  postgres_data:
    name: dafl_postgres_data
  uploads_data:
    name: dafl_uploads_data
